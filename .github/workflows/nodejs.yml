name: Node-CI

on:
  push:
  pull_request:
  create:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: npm install
        run: npm ci
        env:
          CI: true

      - name: npm build
        run: npm run build --if-present
        env:
          CI: true

      - name: npm test
        run: npm test
        env:
          CI: true

      - name: coverage
        run: npm run coverage
        env:
          CI: true

  publish-npm:
    if: (github.repository == 'Supereg/homebridge-http-switch' || github.repository == 'barcar/homebridge-http-switch') && github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v')

    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
